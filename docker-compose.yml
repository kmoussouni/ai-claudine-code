version: '3.8'

services:
  # Serveur Ollama - Modèle AI local
  ollama:
    image: ollama/ollama:latest
    container_name: claudine-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # Décommentez pour GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Agent de code - Interface web avec Continue/Open WebUI
  code-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: claudine-agent
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/workspace
      - agent_config:/app/config
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=qwen2.5-coder:7b
    depends_on:
      - ollama
    restart: unless-stopped

  # Interface Web UI (optionnel mais recommandé)
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: claudine-webui
    ports:
      - "8080:8080"
    volumes:
      - webui_data:/app/backend/data
      - ./webui-functions:/app/backend/data/functions
      - ./workspace/generated-images:/app/backend/static/generated-images
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=changeme_secret_key_here
    depends_on:
      - ollama
      - code-agent
    restart: unless-stopped

  # ComfyUI + FLUX - Génération d'images (meilleure qualité que SD)
  flux-comfyui:
    build:
      context: ./flux-comfyui
      dockerfile: Dockerfile
    container_name: claudine-flux
    ports:
      - "8188:8188"
    volumes:
      - flux_models:/app/models
      - flux_outputs:/app/output
      - ./workspace/generated-images:/workspace/generated-images
    environment:
      - PYTHONUNBUFFERED=1
      # Token HuggingFace requis pour télécharger FLUX.1-schnell
      # Obtenir sur https://huggingface.co/settings/tokens
      # puis accepter la licence : https://huggingface.co/black-forest-labs/FLUX.1-schnell
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    # Décommentez pour GPU NVIDIA (fortement recommandé pour FLUX)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
  agent_config:
  webui_data:
  flux_models:
  flux_outputs:
